<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALESS実験</title>
    <style>
        :root {
            --primary-color: #0047BA;
            --bg-color: #f4f7f6;
            --key-bg: #ffffff;
            --key-active: #e0e5ec;
            --text-color: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .progress {
            font-size: 1rem;
            font-weight: bold;
            color: #666;
            display: none;
        }

        /* 初期入力画面 */
        #start-screen {
            text-align: center;
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .input-group {
            margin-bottom: 30px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-color);
        }

        .btn-start {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #002d80;
            transition: all 0.1s;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        /* ゲーム画面 */
        #game-screen {
            display: none;
        }

        .question-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .japanese-word {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .input-display {
            background: var(--bg-color);
            min-height: 50px;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 1.8rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: bold;
            text-transform: lowercase;
        }

        .feedback {
            height: 24px;
            margin-bottom: 10px;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background: var(--key-bg);
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            flex: 1;
            max-width: 45px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
            text-transform: lowercase;
        }

        .key:active {
            background: var(--key-active);
            transform: translateY(2px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .key.wide {
            max-width: 80px;
            font-size: 1rem;
            background: #e2e8f0;
        }

        .key.enter {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 結果画面 */
        #result-screen {
            display: none;
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .thanks-message {
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 40px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ALESS実験</h1>
        <div class="progress" id="progress-text">第 1 問 / 15 問</div>
    </header>

    <div id="start-screen">
        <div class="input-group">
            <label for="user-id">識別番号（例: 被験者NO、学生番号など）</label>
            <input type="text" id="user-id" class="input-field" placeholder="番号を入力してください">
        </div>
        
        <button class="btn-start" onclick="startTest()">テストを開始する</button>
    </div>

    <div id="game-screen">
        <div class="question-area">
            <div class="japanese-word" id="jp-word">--</div>
            <div class="input-display" id="input-display"></div>
            <div class="feedback" id="feedback-text"></div>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <div id="result-screen">
        <div class="thanks-message">
            実験へのご協力<br>ありがとうございました！
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbycOkNxCV4ucFEEjtX51c-SDTrFX9IlxdaV6S_yZgra7uI2qzRRRArQ3S2FAXZ6-yWS/exec";

    const wordList = [
        { fi: "talo", ja: "家" },
        { fi: "kala", ja: "魚" },
        { fi: "vesi", ja: "水" },
        { fi: "tuli", ja: "火" },
        { fi: "aamu", ja: "朝" },
        { fi: "kuva", ja: "絵" },
        { fi: "sana", ja: "言葉" },
        { fi: "loma", ja: "休暇" },
        { fi: "joki", ja: "川" },
        { fi: "koti", ja: "自宅" },
        { fi: "lumi", ja: "雪" },
        { fi: "mies", ja: "男性" },
        { fi: "raha", ja: "お金" },
        { fi: "susi", ja: "狼" },
        { fi: "puku", ja: "服" }
    ];

    const keyboardLayout = [
        ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
        ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
        ['DEL', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'ENTER']
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let currentInput = "";
    let isAnswerChecked = false;
    let userId = "";
    
    let participantAnswers = [];
    let participantTotalScore = 0.0;

    function shuffle(array) {
        let idx = array.length, randomIdx;
        while (idx !== 0) {
            randomIdx = Math.floor(Math.random() * idx);
            idx--;
            [array[idx], array[randomIdx]] = [array[randomIdx], array[idx]];
        }
        return array;
    }

    function getLevenshteinDistance(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    function createKeyboard() {
        const keyboardContainer = document.getElementById('keyboard');
        keyboardContainer.innerHTML = '';
        keyboardLayout.forEach(row => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'keyboard-row';
            row.forEach(key => {
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key';
                keyDiv.textContent = key;
                if (key === 'DEL') {
                    keyDiv.classList.add('wide');
                    keyDiv.textContent = '削除';
                    keyDiv.onclick = () => handleInput('DEL');
                } else if (key === 'ENTER') {
                    keyDiv.classList.add('wide', 'enter');
                    keyDiv.textContent = '決定';
                    keyDiv.onclick = () => handleInput('ENTER');
                } else {
                    keyDiv.onclick = () => handleInput(key);
                }
                rowDiv.appendChild(keyDiv);
            });
            keyboardContainer.appendChild(rowDiv);
        });
    }

    function handleInput(key) {
        if (isAnswerChecked && key !== 'ENTER') return;
        if (key === 'DEL') {
            currentInput = currentInput.slice(0, -1);
        } else if (key === 'ENTER') {
            if (isAnswerChecked) {
                nextQuestion();
            } else {
                if (currentInput.length > 0) checkAnswer();
            }
            return;
        } else {
            if (currentInput.length < 4) {
                currentInput += key;
            }
        }
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('input-display').textContent = currentInput;
    }

    function checkAnswer() {
        const correctAnswer = currentQuestions[currentIndex].fi;
        const jpQuestion = currentQuestions[currentIndex].ja;
        isAnswerChecked = true;

        const distance = getLevenshteinDistance(currentInput, correctAnswer);
        let scoreEarned = 0.0;
        let gradingLabel = "Incorrect";

        if (distance === 0) {
            scoreEarned = 1.0;
            gradingLabel = "Perfect";
        } else if (distance === 1) {
            scoreEarned = 0.7;
            gradingLabel = "Minor Mistake";
        } else if (distance === 2) {
            scoreEarned = 0.3;
            gradingLabel = "Major Mistake";
        } else {
            scoreEarned = 0.0;
            gradingLabel = "Incorrect";
        }

        participantAnswers.push({
            question: jpQuestion,
            userInput: currentInput,
            score: scoreEarned,
            grading: gradingLabel
        });

        participantTotalScore += scoreEarned;

        const enterKey = document.querySelector('.key.enter');
        if (enterKey) enterKey.textContent = '次へ';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            sendAllData();
            showResult();
        }
    }

    function sendAllData() {
        if (GAS_URL.startsWith("http")) {
            const sendData = {
                userId: userId,
                answers: participantAnswers,
                totalScore: participantTotalScore.toFixed(1)
            };

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(sendData)
            }).catch(e => console.log("送信エラー", e));
        }
    }

    function loadQuestion() {
        currentInput = "";
        isAnswerChecked = false;
        
        if(currentQuestions && currentQuestions[currentIndex]) {
            document.getElementById('jp-word').textContent = currentQuestions[currentIndex].ja;
            document.getElementById('progress-text').textContent = `第 ${currentIndex + 1} 問 / ${currentQuestions.length} 問`;
        }
        
        const enterKey = document.querySelector('.key.enter');
        if (enterKey) enterKey.textContent = '決定';
        updateDisplay();
    }

    function showResult() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('progress-text').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }

    function showStartScreen() {
        document.getElementById('start-screen').style.display = 'block';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('progress-text').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('user-id').value = "";
    }

    function startTest() {
        const inputVal = document.getElementById('user-id').value.trim();
        
        if (!inputVal) {
            alert("識別番号を入力してください。");
            return;
        }
        
        userId = inputVal;
        initGame();
    }

    function initGame() {
        currentQuestions = shuffle([...wordList]);
        currentIndex = 0;
        participantAnswers = [];
        participantTotalScore = 0.0;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        createKeyboard();
        loadQuestion();
    }

    window.onload = showStartScreen;
</script>

</body>
</html>
